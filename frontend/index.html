<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePDF — Online PDF Tools for Document Productivity</title>
    <meta name="description" content="Every PDF tool you need, 100% free and easy to use. Merge, split, compress, convert, rotate, unlock, and protect PDF files in seconds with SimplePDF." />
    
    <!-- Canonical & Search Directives -->
    <link rel="canonical" href="https://simplepdf.me/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Crawler Asset Performance & DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Google Search Console Verification (injected conditionally when configured) -->
    <script>
      (function () {
        var gsc = '%VITE_GSC_VERIFICATION%';
        if (gsc && gsc.indexOf('%VITE_') === -1 && gsc !== 'google-site-verification-placeholder') {
          var meta = document.createElement('meta');
          meta.name = 'google-site-verification';
          meta.content = gsc;
          document.head.appendChild(meta);
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://simplepdf.me/" />
    <meta property="og:title" content="SimplePDF — Online PDF Tools for Document Productivity" />
    <meta property="og:description" content="Every PDF tool you need, 100% free and easy to use. Merge, split, compress, convert, rotate, unlock, and protect PDF files in seconds with SimplePDF." />
    <meta property="og:image" content="https://simplepdf.me/og-cover.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://simplepdf.me/" />
    <meta name="twitter:title" content="SimplePDF — Online PDF Tools for Document Productivity" />
    <meta name="twitter:description" content="Every PDF tool you need, 100% free and easy to use. Merge, split, compress, convert, rotate, unlock, and protect PDF files in seconds with SimplePDF." />
    <meta name="twitter:image" content="https://simplepdf.me/og-cover.png" />

    <!-- Google Analytics 4 (GA4) with Zero-PII & Cookie Consent Gate -->
    <script>
      (function () {
        var gaId = '%VITE_GA_MEASUREMENT_ID%';
        function loadGa() {
          if (!gaId || gaId.indexOf('%VITE_') !== -1 || gaId === 'G-XXXXXXXXXX') return;
          if (window.__simplepdfGaLoaded) return;
          window.__simplepdfGaLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', gaId, {
            anonymize_ip: true,
            send_page_view: true
          });
        }
        try {
          if (localStorage.getItem('simplepdf_cookie_consent') === 'accepted') {
            loadGa();
          }
          window.addEventListener('simplepdf:cookie-consent', function (e) {
            if (e && e.detail === 'accepted') loadGa();
          });
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PDF.js CDN for Client-Side Rendering & Thumbnails -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
