user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Sub-millisecond Kernel File Descriptor Cache for Static Pages & Crawlers
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Upload size allowance for documents (Aligned with 50MB free tier + multipart overhead)
    client_max_body_size 60M;
    client_body_buffer_size 256k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDoS & Abuse Defense)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=job_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Backend Multi-Instance Cluster Pool (Load Balancing with Least Connections)
    upstream backend_cluster {
        least_conn; # Route incoming request to instance with fewest active connections
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # =========================================================================
    # 1. HTTP Server Block (Port 80) — ACME Challenge & Canonical HTTPS Redirect
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name simplepdf.me www.simplepdf.me localhost;

        # Let's Encrypt / Certbot renewal verification challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all plain HTTP traffic to preferred canonical domain: https://simplepdf.me
        location / {
            return 301 https://simplepdf.me$request_uri;
        }
    }

    # =========================================================================
    # 2. HTTPS Alternate Hostname Redirect (www.simplepdf.me -> simplepdf.me)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.simplepdf.me;

        ssl_certificate /etc/letsencrypt/live/simplepdf.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/simplepdf.me/privkey.pem;

        return 301 https://simplepdf.me$request_uri;
    }

    # =========================================================================
    # 3. Canonical HTTPS Production Server Block (https://simplepdf.me)
    # =========================================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name simplepdf.me;

        # SSL Configuration (Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/simplepdf.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/simplepdf.me/privkey.pem;

        # Modern SSL Ciphers & Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HSTS (Strict-Transport-Security: 1 Year + Preload)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Production Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self';" always;

        # Root static directory containing pre-rendered HTML & assets
        root /usr/share/nginx/html;

        # Custom 404 Error Page with genuine HTTP 404 status
        error_page 404 /404.html;

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Static Asset Delivery with Long-Lived Immutable Cache (repeats security headers)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        # Crawl-Optimized Headers for Prerendered HTML, Sitemaps, Feeds, and LLM manifests
        location ~* \.(html|xml|txt)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            add_header X-Robots-Tag "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }

        # Explicit SPA Application Routes (Client-rendered with noindex, strictly separated from SEO tools)
        location ~ ^/(dashboard|admin|login|register|checkout)$ {
            try_files /index.html =404;
            add_header X-Robots-Tag "noindex, nofollow" always;
            expires -1;
        }

        # Pre-rendered SEO Pages & Tool Resolution
        # 1. Tests exact file ($uri)
        # 2. Tests pre-rendered tool/page folder ($uri/index.html)
        # 3. Tests directory ($uri/)
        # 4. Triggers custom 404 error page with HTTP status 404!
        location / {
            index index.html;
            try_files $uri $uri/index.html $uri/ =404;
        }

        # Backend Health & Readiness Probes (Unthrottled)
        location ~ ^/api/(health|ready)$ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Conversion Jobs API (Large File Streaming & Extended Timeout)
        location /api/v1/jobs {
            limit_req zone=job_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }

        # General API Traffic
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
